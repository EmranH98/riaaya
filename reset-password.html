<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="إعادة تعيين كلمة المرور في رعاية">
  <title>رعاية | إعادة تعيين كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css?v=20260619">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-context">
      <a class="auth-brand" href="index.html">
        <img src="assets/riaaya-logo-mark.png" alt="">
        <span><strong>RIAAYA</strong><small>إدارة العيادات</small></span>
      </a>
      <div>
        <p class="eyebrow">استعادة كلمة المرور</p>
        <h1>اختر كلمة مرور جديدة قوية.</h1>
        <p>يجب أن تكون 12 خانة على الأقل وتحتوي على حرف كبير وصغير ورقم ورمز خاص.</p>
      </div>
    </section>

    <section class="auth-workspace">
      <div id="reset-expired-banner" class="auth-notice auth-notice--warn" hidden>
        <span>⏱</span>
        <span>انتهت صلاحية الرابط. <a href="auth.html">اطلب رابط جديد</a>.</span>
      </div>

      <form class="auth-form" data-reset-form>
        <div class="form-heading">
          <p class="eyebrow">الخطوة الأخيرة</p>
          <h2>اختر كلمة مرور جديدة</h2>
        </div>
        <label>
          كلمة المرور الجديدة
          <input name="password" type="password" autocomplete="new-password" minlength="12" required>
          <small>12 خانة على الأقل، مع حرف كبير وصغير ورقم ورمز.</small>
        </label>
        <button class="primary-action" type="submit">حفظ كلمة المرور الجديدة</button>
        <p class="form-status" data-reset-status aria-live="polite"></p>
      </form>

      <div id="reset-success" class="auth-notice auth-notice--ok" hidden>
        <span>✓</span>
        <span>تم تعيين كلمة المرور بنجاح. <a href="auth.html">اضغط هنا للدخول</a>.</span>
      </div>
    </section>
  </main>
  <script src="reset-password.js?v=20260620"></script>
</body>
</html>
