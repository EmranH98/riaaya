services:
  - type: web
    name: riaaya
    runtime: docker
    # Persistent disks require a paid instance type (Free has no durable storage).
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Durable storage so clinic data survives every deploy/restart.
    disk:
      name: riaaya-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: RIAAYA_DEPLOYMENT_MODE
        value: production
      - key: PORT
        value: 4174
      - key: RIAAYA_DB_PATH
        value: /data/riaaya.sqlite
      - key: RIAAYA_BACKUP_DIR
        value: /data/backups
      - key: RIAAYA_BACKUP_RETENTION
        value: 30
      - key: RIAAYA_BACKUP_INTERVAL_HOURS
        value: 6
      - key: RIAAYA_OWNER_SYNC
        value: true
      - key: RIAAYA_ORIGIN
        value: https://riaaya.onrender.com
      # SECRETS — never commit real values to this PUBLIC repo. Set them in the
      # Render dashboard (Environment tab). `sync: false` tells Render to keep the
      # dashboard value and never overwrite it from this file.
      - key: RIAAYA_OWNER_EMAIL
        sync: false
      - key: RIAAYA_OWNER_PASSWORD
        sync: false
      - key: RIAAYA_ENCRYPTION_KEY
        sync: false
      - key: RIAAYA_EMAIL_PROVIDER
        sync: false
      - key: RIAAYA_RESEND_API_KEY
        sync: false
      - key: RIAAYA_EMAIL_FROM
        sync: false
      - key: RIAAYA_SMTP_HOST
        sync: false
      - key: RIAAYA_SMTP_PORT
        value: 465
      - key: RIAAYA_SMTP_USER
        sync: false
      - key: RIAAYA_SMTP_PASS
        sync: false
      - key: RIAAYA_ALERT_WEBHOOK
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        value: auto
      - key: LITESTREAM_PREFIX
        value: riaaya/backups
      - key: RIAAYA_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: RIAAYA_CLOUDFLARE_API_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://riaaya.onrender.com
