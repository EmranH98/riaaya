services:
  - type: web
    name: riaaya
    runtime: docker
    # Persistent disks require a paid instance type (Free has no durable storage).
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Durable storage so clinic data survives every deploy/restart.
    disk:
      name: riaaya-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: RIAAYA_DEPLOYMENT_MODE
        value: preview
      - key: PORT
        value: 4174
      - key: RIAAYA_DB_PATH
        value: /data/riaaya.sqlite
      - key: RIAAYA_BACKUP_DIR
        value: /data/backups
      - key: RIAAYA_ALLOW_EPHEMERAL_STORAGE
        value: true
      - key: RIAAYA_BACKUP_RETENTION
        value: 30
      - key: RIAAYA_OWNER_SYNC
        value: true
      - key: RIAAYA_OWNER_EMAIL
        value: preview-owner@riaaya.local
      - key: RIAAYA_OWNER_PASSWORD
        value: PreviewOwner1!
      - key: RIAAYA_ENCRYPTION_KEY
        value: preview-free-riaaya-encryption-key-change-before-production
      - key: ALLOWED_ORIGIN
        value: https://riaaya.onrender.com
