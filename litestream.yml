# Optional Litestream config for future continuous SQLite replication.
# Current production off-site backups are handled by lib/offsite-backup.js:
# every verified backup snapshot is uploaded to the S3-compatible bucket
# configured with the env vars below.
#
# This file is kept for a later upgrade to point-in-time Litestream restore.
# It does not activate by itself.
#
# To enable on Render:
#   1. Create an S3 / Backblaze B2 / Cloudflare R2 bucket.
#   2. Set env: LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY,
#      LITESTREAM_BUCKET, LITESTREAM_ENDPOINT (for B2/R2).
#   3. Run the app under litestream (see Dockerfile note) so it replicates live
#      and can `litestream restore` after a disk loss.
#
# Restore after disk loss:
#   litestream restore -o /data/riaaya.sqlite "s3://${LITESTREAM_BUCKET}/riaaya"

dbs:
  - path: ${RIAAYA_DB_PATH}
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: riaaya
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h          # keep 30 days of point-in-time history
        snapshot-interval: 6h
        validation-interval: 24h
