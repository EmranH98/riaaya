name: CI

# Runs backend, concurrency, build, and visual checks on every push/PR so
# security, tenant isolation, workflow, and packaging regressions are caught.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium for visual checks
        run: npx playwright install --with-deps chromium
      - name: Security, end-to-end, and concurrency tests
        run: npm test
      - name: Build deployable static assets
        run: npm run build
      - name: Desktop and mobile screenshot regression
        run: npm run visual
